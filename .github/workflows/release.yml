# 编译与发布 CZL AI 客户端（Windows 安装包 + macOS dmg / zip + Android apk）。
#
# 源码在私有仓库 woodchen-ink/czlai，编译放在这个公开仓库里跑：公开仓库的 Actions 不计分钟数，
# 而私有仓库的 Windows runner 按 2 倍、macOS runner 按 10 倍计费。
#
# 触发方式：
#   repository_dispatch (event_type: release)
#       由私有仓库的 Release 流程发来，client_payload = { ref, sha, publish }：
#       推 v* 标签时 publish=true，编译并以同名标签发布 Release；在私有仓库手动运行时取它的输入，
#       publish=false 即试运行，只编译不发布。日常不用来这个仓库操作。
#   workflow_dispatch
#       在本仓库直接手动运行（补发 / 重跑），参数同上，sha 留空时按 ref 解析。
#
# 两种触发都只有对本仓库有写权限的人能发起；不监听 push / pull_request，fork 发来的 PR 碰不到 secret。
#
# 发布契约（站点按此识别安装包，改名须先改站点与 CZL Connect 发布源的别名）：
#   - 资产名 CZLAI-<os>-<arch>[-<kind>].<ext>，外加 SHA256SUMS（供人工核对）
#   - 对外分发走 CZL Connect「发布下载」：它读本仓库 Release，按别名公开附件、在 latest.json 给出 GitHub 计算的 sha256，
#     站点 /api/desktop/* 读这份清单，客户端自动更新按 sha256 校验
#   - 带 - 后缀的标签发布为 Pre-release，服务端只读 /releases/latest，预发布不会推给用户
#   - 同一标签重跑时覆盖上传资产，不新建重复 Release
#
# 需要的 secret：
#   SOURCE_REPO_TOKEN  对 woodchen-ink/czlai 有 Contents 只读权限的 fine-grained PAT
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#                      Android 发布签名（base64 的 .jks）。换签名 = 已安装的用户无法覆盖升级，丢了也无法再发更新，务必备份
#   CZL_MACOS_CERT_P12_BASE64 / CZL_MACOS_CERT_PASSWORD
#                      macOS Developer ID Application 证书（团队 CZL LTD，base64 的 .p12，与 czlmail 共用一张）
#   CZL_APPLE_API_KEY_P8_BASE64 / CZL_APPLE_API_KEY_ID / CZL_APPLE_API_ISSUER_ID / CZL_APPLE_TEAM_ID
#                      App Store Connect API Key，用于 macOS 公证。缺任一项时 macOS 退回 ad-hoc 签名（不报错）
#                      证书与 Key 的备份在本机群晖 backup/.czlmail-macos，不进任何仓库
# 发布用本仓库自带的 GITHUB_TOKEN。

name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: '源码的标签或分支，如 v2.82.0 或 main'
        required: true
        default: main
      sha:
        description: '源码 commit SHA（留空按 ref 解析）'
        required: false
        default: ''
      publish:
        description: '发布为 Release（只对 v* 标签生效）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一个 ref 不并发，防止重复发布
concurrency:
  group: release-${{ github.event.client_payload.ref || inputs.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: woodchen-ink/czlai
  WAILS_VERSION: v2.16.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      publish: ${{ steps.r.outputs.publish }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - name: 解析 ref / SHA / 版本号
        id: r
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_PUBLISH: ${{ github.event.client_payload.publish }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            ref="$DISPATCH_REF" sha="$DISPATCH_SHA" publish="$DISPATCH_PUBLISH"
          else
            ref="$INPUT_REF" sha="$INPUT_SHA" publish="$INPUT_PUBLISH"
          fi
          [ "$publish" = "true" ] || publish=false

          if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then
            echo "::error::非法 ref"; exit 1
          fi
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            version="$ref"
          elif [ "$publish" = "true" ]; then
            echo "::error::只有 vX.Y.Z 标签可以发布：$ref"; exit 1
          else
            # 分支试运行：版本号只用于产物内的版本标识
            version="v0.0.0-dryrun"
          fi

          resolved=$(gh api "repos/${SOURCE_REPO}/commits/${ref}" --jq .sha)
          if [ -z "$sha" ]; then
            sha="$resolved"
          elif [ "$sha" != "$resolved" ]; then
            # 标签被移动过：以转发时的 SHA 为准，但要让人看见
            echo "::warning::ref 当前指向 ${resolved}，按转发的 ${sha} 构建"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::非法 SHA"; exit 1
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "ref=$ref sha=$sha version=$version publish=$publish prerelease=$prerelease"

  windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          # 不把 token 留在 .git/config 里，后续步骤用不到它
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.resolve.outputs.version }}
          wails-version: ${{ env.WAILS_VERSION }}

      - name: 安装 NSIS
        shell: pwsh
        run: |
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $env:PATH = "$nsisDir;$env:PATH"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chocolatey NSIS installation failed (exit $LASTEXITCODE); trying SourceForge"
            }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            # 官方 SourceForge 安装包；SHA256 对齐 microsoft/winget-pkgs 的 NSIS.NSIS 3.13。
            $installer = Join-Path $env:RUNNER_TEMP 'nsis-3.13-setup.exe'
            $url = 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13-setup.exe/download'
            curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output $installer $url
            if ($LASTEXITCODE -ne 0) { throw "SourceForge NSIS download failed (exit $LASTEXITCODE)" }
            $expectedHash = 'DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3'
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'SourceForge NSIS installer SHA256 mismatch'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS installation failed (exit $($process.ExitCode))" }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw 'NSIS installation did not provide makensis' }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS verification failed (exit $LASTEXITCODE)" }

      - name: 测试
        working-directory: src/desktop
        run: go test ./...

      - name: 编译并打安装包
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: ./src/desktop/build.ps1 $env:VERSION -SkipWeb

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: src/desktop/build/bin/CZLAI-windows-*-installer.exe
          if-no-files-found: error
          # 只给本次 publish 用，正式产物在 Release 里
          retention-days: 1

  macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.resolve.outputs.version }}
          wails-version: ${{ env.WAILS_VERSION }}

      - name: 编译
        working-directory: src/desktop
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          PRODUCT_VERSION="${VERSION#v}"; PRODUCT_VERSION="${PRODUCT_VERSION%%-*}"
          sed -i '' -E "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${PRODUCT_VERSION}\"/" wails.json
          # 不要加 -v 2：会把整个进程环境变量打进输出
          "$(go env GOPATH)/bin/wails" build -platform darwin/universal -skipbindings -trimpath             -ldflags "-s -w -X main.version=${VERSION}"

      # 有 Developer ID 证书与公证 Key（secrets CZL_MACOS_* / CZL_APPLE_*，团队 CZL LTD，与 czlmail 共用）时：
      # hardened runtime 由内向外签名 .app → 打 dmg 并签名 → 公证 dmg（连同里面的 .app 一起登记）→ 票据钉到 dmg 与 .app，
      # 再用钉过票据的 .app 打自动更新用的 zip（离线也能过 Gatekeeper）。
      # secrets 不全时（fork / 试运行）退回 ad-hoc 签名：Apple Silicon 不运行无签名代码，这样的包首次打开要在「隐私与安全性」放行。
      # dmg 给首次安装（拖进「应用程序」），zip 给自动更新（updater 取 kind=archive 解压替换 .app，勿删）
      - name: 签名、打包与公证
        working-directory: src/desktop/build/bin
        env:
          CERT_P12_BASE64: ${{ secrets.CZL_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CZL_MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.CZL_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.CZL_APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.CZL_APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CZL_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=$(ls -d *.app | head -n1)
          dmg=CZLAI-darwin-universal.dmg
          zip=CZLAI-darwin-universal.zip
          plutil -lint "$app/Contents/Info.plist"

          make_dmg() {
            rm -rf dmg-root && mkdir dmg-root
            ditto "$app" "dmg-root/$app"
            ln -s /Applications dmg-root/Applications
            # GitHub macOS runner 上 hdiutil 偶发 "Resource busy"，重试几次
            for i in 1 2 3 4 5; do
              hdiutil create -volname "CZL AI" -srcfolder dmg-root -fs HFS+ -format UDZO -ov "$dmg" && break
              [ "$i" = 5 ] && exit 1
              sleep $((i * 5))
            done
            rm -rf dmg-root
          }

          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$API_KEY_P8_BASE64" ]              || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::缺少 macOS 签名 / 公证 secrets，改用 ad-hoc 签名，用户首次打开需在「隐私与安全性」放行"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --keepParent "$app" "$zip"
            make_dmg
            exit 0
          fi

          # 证书导入一次性钥匙串，清理在下一步（always）里做
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain"             | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "::error::钥匙串里没有 Team $TEAM_ID 的 Developer ID Application 证书"; exit 1; }

          # 由内向外：先签包内其他 Mach-O（目前没有，以后加 helper / dylib 时自动覆盖），最后签 .app 本身。
          # entitlements 在源码仓库 desktop/build/darwin/entitlements.plist（只声明麦克风）
          entitlements="$GITHUB_WORKSPACE/src/desktop/build/darwin/entitlements.plist"
          main_exe="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          sign() { codesign --force --options runtime --timestamp --entitlements "$entitlements" --sign "$identity" "$@"; }
          find "$app/Contents" -type f ! -path "$main_exe" -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then sign "$f"; fi
          done
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'

          make_dmg
          codesign --force --timestamp --sign "$identity" "$dmg"

          # 公证 dmg，失败时打印公证日志。Apple 偶尔排队很久，等待上限放宽到 2 小时
          echo "$API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          notary=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          xcrun notarytool submit "$dmg" "${notary[@]}" --wait --timeout 2h --output-format json | tee notary.json
          status=$(plutil -extract status raw notary.json)
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw notary.json)" "${notary[@]}" || true
            echo "::error::公证未通过: $status"; exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" notary.json

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"
          xcrun stapler staple "$app"
          spctl -a -vvv -t exec "$app"
          ditto -c -k --keepParent "$app" "$zip"

      - name: 清理签名钥匙串
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            src/desktop/build/bin/CZLAI-darwin-universal.zip
            src/desktop/build/bin/CZLAI-darwin-universal.dmg
          if-no-files-found: error
          retention-days: 1

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: src/web/yarn.lock

      # 与 prepare 同样的防泄露处理：失败只打印错误位置与说明，不打印带源码的 code frame
      - name: 构建前端
        shell: bash
        working-directory: src/web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_APP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          yarn install --frozen-lockfile --silent
          log="$RUNNER_TEMP/web-build.log"
          if ! yarn build >"$log" 2>&1; then
            grep -vE '^\s*>?\s*[0-9]*\s*\|' "$log" | grep -iE 'error|failed|:[0-9]+:[0-9]+' | head -n 40
            echo "::error::前端构建失败"
            exit 1
          fi
          grep -E 'modules transformed|built in' "$log" || true

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/mobile/core/go.mod
          cache: false

      - name: 定位 Go module 缓存目录
        id: gomod
        shell: bash
        run: echo "dir=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.gomod.outputs.dir }}
          key: gomod-android-${{ hashFiles('src/mobile/core/go.sum') }}
          restore-keys: gomod-android-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 只缓存依赖下载与 wrapper 发行包，不缓存构建产物
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ hashFiles('src/mobile/android/**/*.gradle.kts', 'src/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 测试 core
        working-directory: src/mobile/core
        run: go test ./...

      # gomobile 版本取 core 的 go.mod（tools.go 钉住），NDK 用 runner 预装的最新版
      - name: 安装 gomobile
        working-directory: src/mobile/core
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: 编译并打包
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CZL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CZL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CZL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::缺少 Android 签名 secret"; exit 1; fi
          export CZL_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$CZL_ANDROID_KEYSTORE"
          bash src/mobile/android/scripts/build.sh "$VERSION" --web-prebuilt
          rm -f "$CZL_ANDROID_KEYSTORE"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: src/mobile/android/build/CZLAI-android-universal.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, windows, macos, android]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 按名字只取三个平台的安装包
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      - name: 校验和
        working-directory: dist
        run: sha256sum CZLAI-* > SHA256SUMS && cat SHA256SUMS

      - name: 发布 Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 重跑：覆盖同名资产，不新建 Release
            gh release upload "$TAG" CZLAI-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            args=(--repo "$GITHUB_REPOSITORY" --title "$TAG"
              --notes "CZL AI 客户端 ${TAG}（Windows / macOS / Android）。下载与安装说明：https://ai.czl.net/download")
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh release create "$TAG" CZLAI-* SHA256SUMS "${args[@]}"
          fi
